name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Build/test never touch a live database (every dashboard page is fully
# dynamic, so `next build` doesn't render them), so these are throwaway
# placeholder values, not secrets. They only need to satisfy env-var
# presence/shape checks (e.g. ENCRYPTION_KEY must decode to 32 bytes).
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-placeholder-auth-secret-not-used-for-anything-real"
  AUTH_GOOGLE_ID: "ci-placeholder"
  AUTH_GOOGLE_SECRET: "ci-placeholder"
  OWNER_EMAIL: "ci@example.com"
  ENCRYPTION_KEY: "dQBxVZfC97w4c7brWwXgTh5TG04Htpqv2eoIHxZu/JE="
  PRICE_STALE_HOURS: "24"
  CRON_SECRET: "ci-placeholder"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
